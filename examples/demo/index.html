<!doctype html>
<html lang="sk">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Demo – Nastavenia</title>
	<style>
		* { box-sizing: border-box; }
		body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1d2327; background: #f0f2f5; }
		header { display: flex; align-items: center; justify-content: space-between; padding: 14px 32px; background: #1f2a44; color: #fff; }
		header .logo { font-weight: 700; font-size: 18px; }
		header nav a { color: #cdd5e4; margin-left: 20px; text-decoration: none; }
		main { max-width: 960px; margin: 32px auto; padding: 0 24px; }
		h1 { margin: 0 0 20px; font-size: 26px; }
		.tabs { display: flex; gap: 4px; border-bottom: 1px solid #d0d5dd; margin-bottom: 20px; }
		.tabs button { border: 0; background: none; padding: 10px 16px; font: inherit; cursor: pointer; color: #555; }
		.tabs button[aria-selected="true"] { color: #2457c5; border-bottom: 2px solid #2457c5; font-weight: 600; }
		.panel { display: none; }
		.panel.active { display: block; }
		.card { background: #fff; border-radius: 10px; padding: 24px; margin-bottom: 20px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
		.card h2 { margin: 0 0 16px; font-size: 17px; }
		.row { display: grid; grid-template-columns: 160px 1fr; align-items: center; gap: 12px; margin-bottom: 12px; }
		input, select { font: inherit; padding: 8px 10px; border: 1px solid #c3c8d0; border-radius: 6px; width: 100%; max-width: 360px; }
		.btn { background: #2457c5; color: #fff; border: 0; border-radius: 6px; padding: 9px 18px; font: inherit; cursor: pointer; }
		table { width: 100%; border-collapse: collapse; }
		th, td { text-align: left; padding: 10px; border-bottom: 1px solid #eceef2; }
		.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; background: #e3f4e8; color: #1e7b3c; font-size: 13px; }
		[data-tip] { position: relative; }
		[data-tip]:hover::after { content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%); white-space: nowrap; background: #1f2a44; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 13px; }
		iframe { width: 100%; height: 120px; border: 1px dashed #c3c8d0; border-radius: 8px; background: #fff; }
	</style>
</head>
<body>
	<header>
		<span class="logo">Demo Admin</span>
		<nav><a href="#">Prehľad</a><a href="#">Nastavenia</a><a href="#">Pomoc</a></nav>
	</header>

	<main>
		<h1>Nastavenia</h1>
		<div class="tabs" role="tablist">
			<button role="tab" aria-selected="true" data-tab="general">Všeobecné</button>
			<button role="tab" aria-selected="false" data-tab="users">Používatelia</button>
		</div>

		<section class="panel active" id="general">
			<div class="card">
				<h2>Základné údaje</h2>
				<div class="row"><label for="site-name">Názov webu</label><input id="site-name" value="Môj web"></div>
				<div class="row"><label for="email">E-mail</label><input id="email" type="email" value="info@example.com"></div>
				<div class="row"><label for="lang">Jazyk</label><select id="lang"><option>Slovenčina</option><option>English</option></select></div>
				<input type="submit" class="btn" value="Uložiť">
			</div>

			<div class="card">
				<h2>Widget (shadow DOM)</h2>
				<status-widget></status-widget>
			</div>

			<div class="card">
				<h2>Vložený obsah (iframe)</h2>
				<iframe title="Vložený obsah" srcdoc="<body style='font:15px system-ui;margin:16px'><p>Obsah v iframe.</p><button id='inner-btn' style='padding:8px 14px'>Tlačidlo v iframe</button></body>"></iframe>
			</div>
		</section>

		<section class="panel" id="users">
			<div class="card">
				<h2>Používatelia</h2>
				<table>
					<thead><tr><th>Meno</th><th>Rola</th><th>Stav</th></tr></thead>
					<tbody>
						<tr><td>Jana Nováková</td><td>Administrátor</td><td><span class="badge" data-tip="Prihlásená pred 5 min">aktívna</span></td></tr>
						<tr><td>Peter Horváth</td><td>Editor</td><td><span class="badge" data-tip="Prihlásený včera">aktívny</span></td></tr>
						<tr><td>Eva Kováčová</td><td>Autor</td><td><span class="badge" data-tip="Prihlásená minulý týždeň">aktívna</span></td></tr>
					</tbody>
				</table>
			</div>
		</section>
	</main>

	<script>
		document.querySelectorAll('[role=tab]').forEach((tab) => tab.addEventListener('click', () => {
			document.querySelectorAll('[role=tab]').forEach((t) => t.setAttribute('aria-selected', String(t === tab)));
			document.querySelectorAll('.panel').forEach((p) => p.classList.toggle('active', p.id === tab.dataset.tab));
		}));

		customElements.define('status-widget', class extends HTMLElement {
			connectedCallback() {
				this.attachShadow({ mode: 'open' }).innerHTML = `
					<style>.w{display:flex;gap:16px}.s{flex:1;padding:14px;border-radius:8px;background:#f5f7fb}.s b{display:block;font-size:22px}</style>
					<div class="w"><div class="s" id="visits"><b>1 284</b>návštev</div><div class="s" id="orders"><b>37</b>objednávok</div></div>`;
			}
		});
	</script>
</body>
</html>
